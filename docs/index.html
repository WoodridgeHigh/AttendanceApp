<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Attendance Register</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  .login-card form { text-align: left; }
  .login-card label { display:block; font-size:0.78rem; color: var(--ink-soft); margin-bottom:4px; margin-top:14px; }
  .login-card input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--paper-line);
    border-radius: var(--radius); font-family: inherit; font-size: 0.95rem;
  }
  .login-card .btn { width: 100%; margin-top: 22px; }
</style>
</head>
<body>
<div class="center-screen">
  <div class="card login-card">
    <div class="display">Attendance Register</div>
    <div class="subtitle" id="schoolName">Sign in to mark attendance</div>

    <form id="loginForm" onsubmit="return handleLogin(event)">
      <label for="username">Username</label>
      <input id="username" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>

      <button class="btn" type="submit" id="loginBtn">Sign in</button>
    </form>
    <div class="error" id="errorMsg" style="display:none;"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/supabaseClient.js"></script>
<script>
document.getElementById('schoolName').textContent = `Sign in to ${CONFIG.SCHOOL_NAME}'s attendance register`;

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
}

async function handleLogin(event) {
  event.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  document.getElementById('errorMsg').style.display = 'none';

  try {
    const result = await Auth.login(username, password);
    if (!result.ok) { showError(result.error); return; }
    window.location.href = result.profile.role === 'admin' ? 'admin.html' : 'teacher.html';
  } catch (err) {
    showError('Could not reach the server. Check your connection and try again.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }
}

window.onload = async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    const profile = await Auth.loadProfile(session.user.id);
    if (profile) {
      localStorage.setItem('attendance_profile', JSON.stringify(profile));
      window.location.href = profile.role === 'admin' ? 'admin.html' : 'teacher.html';
    }
  }
};
</script>
</body>
</html>
